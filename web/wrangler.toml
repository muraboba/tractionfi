name = "tractionfi"
main = ".open-next/worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Single D1 database — used in production (via --remote) and shadowed
# locally by Wrangler (via --local, which writes to .wrangler/state/v3/d1/).
[[d1_databases]]
binding = "DB"
database_name = "tractionfi"
database_id = "fff44e43-cb58-458e-b8e0-3dbd990f2579"
